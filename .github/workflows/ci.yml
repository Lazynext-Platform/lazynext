name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: local
          NEXTAUTH_URL: http://localhost:3100
          AUTH_URL: http://localhost:3100
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          AUTH_SECRET: ci-test-secret-not-for-production
          ATLASCLOUD_BASE: http://localhost:3099/api/v1
          ATLASCLOUD_LLM_BASE: http://localhost:3099/v1
          ATLASCLOUD_API_KEY: mock-key-for-dev

  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          BUILD_TARGET: local

      - name: Create local database
        run: npm run db:push
        env:
          BUILD_TARGET: local
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Seed test account
        run: npm run db:seed:test
        env:
          BUILD_TARGET: local
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Start mock Atlas server
        run: |
          npm run mock-atlas &
          sleep 3
          curl -s http://localhost:3099/health || echo "mock-atlas may not have /health endpoint"

      - name: Run E2E tests
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: true
          NEXTAUTH_URL: http://localhost:3100
          AUTH_URL: http://localhost:3100
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          AUTH_SECRET: ci-test-secret-not-for-production
          ATLASCLOUD_BASE: http://localhost:3099/api/v1
          ATLASCLOUD_LLM_BASE: http://localhost:3099/v1
          ATLASCLOUD_API_KEY: mock-key-for-dev
          BUILD_TARGET: local

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [lint-and-test, build]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run cf:build
        env:
          BUILD_TARGET: cloudflare
          NEXTAUTH_URL: https://lazynext.com
          AUTH_URL: https://lazynext.com
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          AUTH_SECRET: ci-test-secret-not-for-production
          ATLASCLOUD_BASE: https://api.atlascloud.com/api/v1
          ATLASCLOUD_LLM_BASE: https://api.atlascloud.com/v1
          ATLASCLOUD_API_KEY: mock-key-for-dev

      - name: Bundle worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir .open-next/dist
        env:
          CLOUDFLARE_API_TOKEN: dummy-token-for-bundle-check

      - name: Check bundle size
        run: node scripts/check-bundle-size.mjs

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [lint-and-test, build, e2e, bundle-size]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
