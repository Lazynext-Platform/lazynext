name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /github-swapfile || sudo dd if=/dev/zero of=/github-swapfile bs=1M count=16384
          sudo chmod 600 /github-swapfile
          sudo mkswap /github-swapfile
          sudo swapon /github-swapfile
          free -h
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NODE_OPTIONS: "--max-old-space-size=20480"
      - name: Deploy to Cloudflare
        run: npm run cf:deploy-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ATLASCLOUD_API_KEY: ${{ secrets.ATLASCLOUD_API_KEY }}
