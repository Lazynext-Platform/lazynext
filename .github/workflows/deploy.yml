name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /github-swapfile || sudo dd if=/dev/zero of=/github-swapfile bs=1M count=16384
          sudo chmod 600 /github-swapfile
          sudo mkswap /github-swapfile
          sudo swapon /github-swapfile
          free -h
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NODE_OPTIONS: "--max-old-space-size=20480"
      - name: Verify WASM externalization
        run: |
          echo "=== Checking for WASM in assets directory ==="
          ls -la .open-next/assets/wasm/ 2>&1 || echo "No .open-next/assets/wasm directory"
          echo "=== Checking for WASM in public/wasm ==="
          ls -la public/wasm/ 2>&1 || echo "No public/wasm directory"
      - name: Refresh Cloudflare OAuth token
        id: cf-token
        run: |
          set -e
          RESPONSE=$(curl -s -X POST https://dash.cloudflare.com/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}" \
            -d "client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")
          echo "Response: $RESPONSE" | head -c 200
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to refresh OAuth token. Response: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "cf_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "OAuth token refreshed successfully"
      - name: Deploy to Cloudflare
        run: npm run cf:deploy-only
        env:
          CLOUDFLARE_ACCOUNT_ID: "85953070bae00da372951a8833bd3459"
          CLOUDFLARE_API_TOKEN: ${{ steps.cf-token.outputs.cf_token }}
