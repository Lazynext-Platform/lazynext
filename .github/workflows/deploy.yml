name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /github-swapfile || sudo dd if=/dev/zero of=/github-swapfile bs=1M count=16384
          sudo chmod 600 /github-swapfile
          sudo mkswap /github-swapfile
          sudo swapon /github-swapfile
          free -h
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NODE_OPTIONS: "--max-old-space-size=20480"
      - name: Verify WASM externalization
        run: |
          echo "=== Checking for WASM in assets directory ==="
          ls -la .open-next/assets/wasm/ 2>&1 || echo "No .open-next/assets/wasm directory"
          echo "=== Checking for WASM in public/wasm ==="
          ls -la public/wasm/ 2>&1 || echo "No public/wasm directory"
      - name: Deploy to Cloudflare
        run: npm run cf:deploy-minified
        env:
          CLOUDFLARE_ACCOUNT_ID: "85953070bae00da372951a8833bd3459"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      - name: Attach wildcard custom domain
        run: |
          # Wildcard custom domains can't be declared in wrangler.jsonc routes,
          # so we attach *.lazynext.com via the Cloudflare API after each deploy.
          # Only attach if not already attached — re-attaching creates a new SSL
          # cert each time, which takes 5-15 minutes to provision.
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=*.lazynext.com" \
            -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
            -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
            -H "Content-Type: application/json" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('result',[])))")
          if [ "$EXISTING" = "0" ]; then
            echo "Wildcard domain not attached, attaching..."
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
              -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" \
              -H "X-Auth-Key: ${CLOUDFLARE_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"environment\":\"production\",\"hostname\":\"*.lazynext.com\",\"service\":\"lazynext\",\"zone_id\":\"ff0ad1848e936913a9c4b4e85b1f04af\"}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('OK' if d.get('success') else d.get('errors'))"
          else
            echo "Wildcard domain already attached, skipping (avoids new cert provisioning)"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: "85953070bae00da372951a8833bd3459"
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
