name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /github-swapfile || sudo dd if=/dev/zero of=/github-swapfile bs=1M count=16384
          sudo chmod 600 /github-swapfile
          sudo mkswap /github-swapfile
          sudo swapon /github-swapfile
          free -h
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NODE_OPTIONS: "--max-old-space-size=20480"
      - name: Verify WASM externalization
        run: |
          echo "=== Checking for WASM in assets directory ==="
          ls -la .open-next/assets/wasm/ 2>&1 || echo "No .open-next/assets/wasm directory"
          echo "=== Checking for WASM in public/wasm ==="
          ls -la public/wasm/ 2>&1 || echo "No public/wasm directory"
          echo "=== Key file sizes ==="
          ls -lh .open-next/server-functions/default/handler.mjs 2>/dev/null || echo "no handler.mjs"
          ls -lh .open-next/server-functions/default/handler.mjs.meta.json 2>/dev/null || echo "no meta.json"
          du -sh .open-next/assets/ 2>/dev/null || echo "no assets dir"
          du -sh .open-next/server-functions/ 2>/dev/null || echo "no server-functions dir"
          echo "=== Manifest file sizes ==="
          find .open-next/server-functions/default/.next -name "*manifest*" -type f -exec ls -lh {} \; 2>/dev/null | sort -k5 -h -r | head -20
          echo "=== Routes manifest size ==="
          ls -lh .open-next/server-functions/default/.next/routes-manifest.json 2>/dev/null || echo "no routes-manifest.json"
          echo "=== App paths manifest size ==="
          ls -lh .open-next/server-functions/default/.next/app-paths-manifest.json 2>/dev/null || echo "no app-paths-manifest.json"
          echo "=== Middleware manifest size ==="
          ls -lh .open-next/server-functions/default/.next/server/middleware-manifest.json 2>/dev/null || echo "no middleware-manifest.json"
          echo "=== Load manifest external.js size ==="
          find .open-next -name "load-manifest.external.js" -type f -exec ls -lh {} \; 2>/dev/null | head -5
          find node_modules/next/dist/server -name "load-manifest.external.js" -type f -exec ls -lh {} \; 2>/dev/null | head -5
      - name: Deploy to Cloudflare
        run: npm run cf:deploy-minified
        env:
          CLOUDFLARE_ACCOUNT_ID: "85953070bae00da372951a8833bd3459"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
