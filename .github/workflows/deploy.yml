name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '25'
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /github-swapfile || sudo dd if=/dev/zero of=/github-swapfile bs=1M count=16384
          sudo chmod 600 /github-swapfile
          sudo mkswap /github-swapfile
          sudo swapon /github-swapfile
          free -h
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NODE_OPTIONS: "--max-old-space-size=20480"
      - name: Verify WASM externalization
        run: |
          echo "=== Checking for WASM in assets directory ==="
          ls -la .open-next/assets/wasm/ 2>&1 || echo "No .open-next/assets/wasm directory"
          echo "=== Checking for WASM in public/wasm ==="
          ls -la public/wasm/ 2>&1 || echo "No public/wasm directory"
      - name: Deploy to Cloudflare
        run: npm run cf:deploy-minified
        env:
          CLOUDFLARE_ACCOUNT_ID: "85953070bae00da372951a8833bd3459"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
