name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /github-swapfile || sudo dd if=/dev/zero of=/github-swapfile bs=1M count=16384
          sudo chmod 600 /github-swapfile
          sudo mkswap /github-swapfile
          sudo swapon /github-swapfile
          free -h
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NODE_OPTIONS: "--max-old-space-size=20480"
      - name: Copy WASM to assets directory
        run: |
          mkdir -p .open-next/assets/wasm
          if [ -d "public/wasm" ]; then
            cp -r public/wasm/* .open-next/assets/wasm/
            echo "Copied WASM files to assets directory"
            ls -la .open-next/assets/wasm/
          fi
      - name: Configure wrangler OAuth
        run: |
          mkdir -p ~/.wrangler/config
          cat > ~/.wrangler/config/default.toml << EOF
          oauth_token = "${{ secrets.CLOUDFLARE_OAUTH_TOKEN }}"
          expiration_time = "2026-09-09T11:56:47.323Z"
          refresh_token = "${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}"
          scopes = ["user:read", "offline_access", "account:read", "workers:write", "workers_kv:write", "workers_routes:write", "workers_scripts:write", "workers_tail:read", "d1:write", "pages:write", "zone:read", "ssl_certs:write", "ai:write", "ai-search:write", "ai-search:run", "websearch.run", "agent-memory:write", "queues:write", "pipelines:write", "secrets_store:write", "artifacts:write", "flagship:write", "containers:write", "cloudchamber:write", "connectivity:admin", "email_routing:write", "email_sending:write", "browser:write", "challenge-widgets.write"]
          EOF
          # Also write to the alternate config location
          mkdir -p ~/.config/.wrangler/config
          cp ~/.wrangler/config/default.toml ~/.config/.wrangler/config/default.toml
      - name: Deploy to Cloudflare
        run: npm run cf:deploy-only
